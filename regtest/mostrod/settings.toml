# mostrod v0.19.3 settings for the regtest network (from its settings.tpl.toml).
# Only what regtest needs differs from the template; omitted keys take their
# defaults.

[lightning]
lnd_cert_file = '/lnd/tls.cert'
lnd_macaroon_file = '/lnd/data/chain/bitcoin/regtest/admin.macaroon'
lnd_grpc_host = 'https://mostro_lnd:10009'
invoice_expiration_window = 3600
hold_invoice_cltv_delta = 144
hold_invoice_expiration_window = 300
payment_attempts = 3
payment_retries_interval = 60
max_final_cltv_expiry_delta = 144
escrow_deadline_margin_blocks = 24
max_inflight_payouts = 100
max_inflight_payouts_per_destination = 10
payment_cltv_limit = 1008
allow_node_change = false

[nostr]
# PUBLIC TEST KEY — the mostro-regtest fixture (m/44'/1237'/38383'/0/0 of
# "monster ... trade"), pubkey 724497f34e6c4f55f9aa90f5e9dcc326c76a9f2ed817b0f0eb940ee7218ac8d5.
# It guards nothing; never reuse it outside regtest.
nsec_privkey = 'nsec1up62kccjww6jg70veks7rt4xa40ggqysdadfm5syyts5u444mfvsjnmf6h'
relays = ['ws://nostr_relay:8080']

[mostro]
name = "Mostro regtest"
fee = 0
max_routing_fee = 0.002
max_order_amount = 1000000
min_payment_amount = 100
expiration_hours = 24
max_expiration_days = 15
expiration_seconds = 900
user_rates_sent_interval_seconds = 3600
publish_relays_interval = 60
pow = 0
publish_mostro_info_interval = 60
bitcoin_price_api_url = "https://api.yadio.io"
# Empty: every fiat code is accepted.
fiat_currencies_accepted = []
max_orders_per_response = 10
dev_fee_percentage = 0.30

[database]
url = "sqlite:///data/mostro.db"

[expiration]
order_days = 30
rating_days = 90
dispute_days = 90
fee_audit_days = 365
dm_days = 30

[rpc]
enabled = false
listen_address = "127.0.0.1"
port = 50051
