; Shared by the three regtest LND nodes (compose.yml passes --configfile).
; Alias, external IP and TLS domain are per node, on the command line.

[Application Options]
noseedbackup=true
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
maxpendingchannels=10
allow-circular-route=true
trickledelay=1000

[Bitcoin]
bitcoin.regtest=true
bitcoin.node=bitcoind
bitcoin.defaultchanconfs=1

[Bitcoind]
bitcoind.rpchost=bitcoin:18443
bitcoind.rpcuser=bitcoin
bitcoind.rpcpass=bitcoin
bitcoind.zmqpubrawblock=tcp://bitcoin:28334
bitcoind.zmqpubrawtx=tcp://bitcoin:28335

[protocol]
protocol.wumbo-channels=true
