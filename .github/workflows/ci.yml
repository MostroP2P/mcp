name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests from forks run with a read-only token: this workflow needs no
# secrets and writes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  windows-check:
    # The release ships Windows packages, and code behind `#[cfg(unix)]` needs
    # a non-Unix path. Type-checking for the target is enough to catch a
    # missing one; the fake-CLI tests need /bin/sh and stay on Linux.
    name: Check the Windows target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - run: cargo check --locked --target x86_64-pc-windows-msvc --bin mostro-mcp
