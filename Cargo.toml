[package]
name = "mostro-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server exposing Mostro P2P operations to AI agents, backed by mostro-cli"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client", "transport-child-process"] }
tempfile = "3"
